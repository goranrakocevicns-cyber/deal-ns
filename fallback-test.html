<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fallback test | DEAL NS</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><a class="brand header-brand" href="index.html"><span>DEAL</span> NS <small>FALLBACK TEST</small></a></header><main class="subpage"><section class="section"><p class="eyebrow dark">NEZAVISNI BACKUP TEST</p><h1 class="page-title">GitHub fallback sadržaj</h1><p id="test-status">Učitavanje rezervne kopije…</p><div id="reference-list" class="reference-grid"></div><h2>Galerija iz backup-a</h2><div id="gallery-grid" class="gallery-grid"></div></section></main><script src="fallback-data.js?v=fallback-test"></script><script>function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const d=window.DEAL_FALLBACK||{references:[],gallery:[]};const status=document.getElementById('test-status');status.textContent=`Fallback učitan: ${d.references.length} referenci, ${d.gallery.length} fotografija.`;const refs=document.getElementById('reference-list');refs.innerHTML=d.references.length?d.references.slice().reverse().map(x=>{const image=x.cover||x.images?.[0]||'';return `<article class="reference-card${image?'':' no-image'}">${image?`<img src="${esc(image)}" alt="${esc(x.title)}">`:''}<div><h3>${esc(x.title)}</h3>${x.short?`<p>${esc(x.short)}</p>`:''}<p>${esc(x.description||'')}</p></div></article>`}).join(''):'<p>Nema referenci u fallback kopiji.</p>';const g=document.getElementById('gallery-grid');g.innerHTML=d.gallery.length?d.gallery.slice().reverse().map(x=>`<figure><img src="${esc(x.src)}" alt="DEAL NS backup fotografija" loading="lazy"></figure>`).join(''):'<p>Nema fotografija u fallback kopiji.</p>';</script></body></html>
