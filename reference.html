<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Referenca | DEAL NS</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><a class="brand header-brand" href="index.html"><span>DEAL</span> NS <small>NOVI SAD</small></a><button class="menu" aria-label="Meni">☰</button><nav><a href="index.html#reference">← Reference</a><a href="gallery.html">Galerija</a><a href="index.html#kontakt">Kontakt</a></nav></header><main class="subpage"><article id="reference-detail" class="section reference-detail"><p>Učitavanje…</p></article></main><div id="lightbox" class="lightbox" hidden><button aria-label="Zatvori">×</button><img alt=""></div><script src="script.js"></script><script src="site-content.js"></script><script>const id=new URLSearchParams(location.search).get('id');loadDealData().then(d=>{const r=(d.references||[]).find(x=>x.id===id&&x.published!==false),el=document.getElementById('reference-detail');if(!r){el.innerHTML='<h1>Referenca nije pronađena.</h1>';return}document.title=r.title+' | DEAL NS';el.innerHTML=`<p class="eyebrow dark">REFERENCA</p><h1 class="page-title">${esc(r.title)}</h1>${r.short?`<p class="reference-lead">${esc(r.short)}</p>`:''}<div class="reference-copy">${esc(r.description||'').replace(/\n/g,'<br>')}</div><div class="detail-gallery">${(r.images||[]).map(x=>`<img src="${esc(x)}" alt="${esc(r.title)}" loading="lazy" data-full="${esc(x)}">`).join('')}</div>`;document.querySelectorAll('[data-full]').forEach(i=>i.onclick=()=>{const l=document.getElementById('lightbox');l.querySelector('img').src=i.dataset.full;l.hidden=false})});const l=document.getElementById('lightbox');l.querySelector('button').onclick=()=>l.hidden=true;l.onclick=e=>{if(e.target===l)l.hidden=true}</script></body></html>
