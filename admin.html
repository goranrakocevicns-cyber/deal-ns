<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | DEAL NS</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><a class="brand header-brand" href="index.html"><span>DEAL</span> NS <small>NOVI SAD</small></a><nav><a href="index.html">Sajt</a><a href="gallery.html">Galerija</a></nav></header><main class="subpage"><section class="section admin-wrap"><p class="eyebrow dark">DEAL NS</p><h1 class="page-title">Admin</h1><div id="login-box" class="admin-box"><h2>Prijava</h2><p>Za objavljivanje je potreban GitHub pristupni token. Token ostaje samo u ovoj kartici pregledača i ne upisuje se na sajt.</p><label>GitHub token<input id="gh-token" type="password" autocomplete="off"></label><button id="login-btn" class="btn primary">Prijavi se</button><p id="login-msg"></p></div><div id="editor" hidden><div class="admin-box"><h2>Nova referenca</h2><form id="ref-form"><label>Naslov<input id="ref-title" required></label><label>Kratak opis<input id="ref-short"></label><label class="full">Detaljan opis<textarea id="ref-description" rows="8" required></textarea></label><label class="full">Fotografije<input id="ref-images" type="file" accept="image/*" multiple required></label><div class="full"><button class="btn primary" type="submit">Objavi referencu</button></div></form><p id="publish-msg"></p></div><div class="admin-box"><h2>Fotografije samo za galeriju</h2><label>Izaberite fotografije<input id="gallery-images" type="file" accept="image/*" multiple></label><button id="gallery-upload" class="btn primary">Dodaj u galeriju</button><p id="gallery-msg"></p></div><div class="admin-box"><h2>Objavljene reference</h2><div id="admin-list"></div></div></div></section></main><script src="admin.js"></script></body></html>
