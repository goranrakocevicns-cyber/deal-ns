<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galerija | DEAL NS</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><a class="brand header-brand" href="index.html"><span>DEAL</span> NS <small>NOVI SAD</small></a><button class="menu" aria-label="Meni">☰</button><nav><a href="index.html#o-nama">O nama</a><a href="index.html#usluge">Usluge</a><a href="index.html#reference">Reference</a><a href="gallery.html">Galerija</a><a href="index.html#kontakt">Kontakt</a><a href="admin.html">Admin</a></nav></header><main class="subpage"><section class="section"><p class="eyebrow dark">GALERIJA</p><h1 class="page-title">Naši radovi u fotografijama.</h1><div id="gallery-grid" class="gallery-grid"></div></section></main><div id="lightbox" class="lightbox" hidden><button aria-label="Zatvori">×</button><img alt=""></div><script src="script.js"></script><script src="site-content.js"></script><script>loadDealData().then(d=>{const refs=(d.references||[]).filter(x=>x.published!==false);const imgs=[];refs.forEach(r=>(r.images||[]).forEach(src=>imgs.push({src,title:r.title,id:r.id})));(d.gallery||[]).forEach(x=>imgs.push(typeof x==='string'?{src:x,title:''}:x));const g=document.getElementById('gallery-grid');g.innerHTML=imgs.length?imgs.slice().reverse().map(x=>`<figure><img src="${esc(x.src)}" alt="${esc(x.title||'DEAL NS radovi')}" loading="lazy" data-full="${esc(x.src)}">${x.id?`<a href="reference.html?id=${encodeURIComponent(x.id)}">${esc(x.title)}</a>`:''}</figure>`).join(''):'<p>Galerija još nema fotografija.</p>';document.querySelectorAll('[data-full]').forEach(i=>i.onclick=()=>{const l=document.getElementById('lightbox');l.querySelector('img').src=i.dataset.full;l.hidden=false});});const l=document.getElementById('lightbox');l.querySelector('button').onclick=()=>l.hidden=true;l.onclick=e=>{if(e.target===l)l.hidden=true}</script></body></html>
